<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F3E9" />
      <stop offset="100%" stop-color="#EADBCE" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2E8DC" />
    </linearGradient>
    <filter id="doveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Left Wing -->
  <path d="M 95 105 C 70 70 30 40 10 35 C 18 55 35 75 60 90 C 75 100 88 105 95 105 Z" fill="url(#wingGrad)" filter="url(#doveGlow)"/>
  <path d="M 95 105 C 65 60 20 25 0 20 C 15 45 40 70 75 92 Z" fill="url(#wingGrad)" opacity="0.8"/>
  <!-- Right Wing -->
  <path d="M 105 105 C 130 65 170 30 195 20 C 180 45 155 70 120 92 C 110 98 105 105 105 105 Z" fill="url(#wingGrad)" filter="url(#doveGlow)"/>
  <path d="M 105 105 C 135 55 180 15 200 10 C 185 38 160 65 125 88 Z" fill="url(#wingGrad)" opacity="0.8"/>
  <!-- Tail -->
  <path d="M 92 115 C 85 140 75 170 65 185 C 80 178 100 175 115 185 C 110 165 105 140 100 115 Z" fill="url(#wingGrad)"/>
  <!-- Body -->
  <path d="M 95 105 C 85 95 82 85 88 72 C 94 60 106 58 114 66 C 120 72 122 82 118 92 C 112 105 102 115 95 105 Z" fill="url(#bodyGrad)"/>
  <!-- Head & Beak -->
  <circle cx="106" cy="64" r="9" fill="url(#bodyGrad)"/>
  <path d="M 114 62 L 124 65 L 115 67 Z" fill="#D4AF37"/>
  <!-- Eye -->
  <circle cx="109" cy="62" r="1.5" fill="#5c4a3d"/>
</svg>
